<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administratorski Vmesnik - Čakalna Vrsta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Glava -->
    <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Nadzor Čakalne Vrste</h1>
        <p class="text-sm text-slate-500">Upravljanje prijav in statusov poslane e-pošte</p>
      </div>
      <span id="db-status" class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-semibold">Povezovanje...</span>
    </header>

    <!-- Čakalna vrsta in E-pošta -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-bold">Prijave za testiranje</h2>
        <div class="flex space-x-4 text-sm">
          <span class="flex items-center"><span class="w-3 h-3 bg-yellow-400 rounded-full mr-2"></span> Čakajoči</span>
          <span class="flex items-center"><span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span> Sprejeti (Poslano)</span>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-slate-50 text-slate-600 text-sm">
              <th class="p-3 w-10">#</th>
              <th class="p-3">ID / Uporabnik</th>
              <th class="p-3">E-poštni naslov</th>
              <th class="p-3">Datum prijave (in 1. e-pošte)</th>
              <th class="p-3">Datum spremembe / napredovanja</th>
              <th class="p-3">Status</th>
              <th class="p-3">Akcije</th>
            </tr>
          </thead>
          <tbody id="waiting-list-body" class="divide-y text-sm">
            <tr><td colspan="7" class="p-4 text-center text-slate-400">Nalaganje prijav...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // 1. POVEZAVA NA BAZO
    firebase.initializeApp({
      databaseURL: "https://jasa-petrinjak-zvezki-default-rtdb.europe-west1.firebasedatabase.app"
    });
    
    const db = firebase.database();

    // Prikaz statusa povezave
    db.ref('.info/connected').on('value', (snap) => {
      const statusEl = document.getElementById('db-status');
      if (snap.val() === true) {
        statusEl.textContent = "Povezano";
        statusEl.className = "px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold";
      } else {
        statusEl.textContent = "Brez povezave";
        statusEl.className = "px-3 py-1 bg-red-100 text-red-800 rounded-full text-xs font-semibold";
      }
    });

    // POSLUŠANJE PODATKOV ČAKALNE VRSTE V REALNEM ČASU
    db.ref('waitingList').on('value', (snapshot) => {
      const waitingList = snapshot.val() || {};
      renderWaitingListTable(waitingList);
    });

    // PRIKAZ ČAKALNE VRSTE
    function renderWaitingListTable(waitingList) {
      const tbody = document.getElementById('waiting-list-body');
      tbody.innerHTML = '';

      const requestKeys = Object.keys(waitingList);
      if (requestKeys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-400">Ni prejetih prijav.</td></tr>';
        return;
      }

      // Sortiranje (najprej čakajoči, nato poslani)
      requestKeys.sort((a, b) => {
        const statusA = waitingList[a].status || 'waiting';
        const statusB = waitingList[b].status || 'waiting';
        if (statusA === 'waiting' && statusB !== 'waiting') return -1;
        if (statusA !== 'waiting' && statusB === 'waiting') return 1;
        return 0;
      });

      // Zanka za izris vsake vrstice z oštevilčenjem
      requestKeys.forEach((reqId, index) => {
        const req = waitingList[reqId];
        const isSent = req.status === 'sent';
        const statusClass = isSent ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
        const statusText = isSent ? 'Sprejet' : 'V čakalni vrsti';
        
        const nextStatus = isSent ? 'waiting' : 'sent';
        const actionBtnText = isSent ? 'Premakni v čakalno' : 'Sprejmi (Označi poslano)';
        const actionBtnClass = isSent ? 'bg-slate-500 hover:bg-slate-600' : 'bg-indigo-600 hover:bg-indigo-700';

        const tr = document.createElement('tr');
        tr.className = isSent ? 'bg-slate-50/50' : '';
        tr.innerHTML = `
          <td class="p-3 font-semibold text-slate-400">${index + 1}</td>
          <td class="p-3">
            <div class="font-semibold text-slate-900">${req.name || 'Neznano ime'}</div>
            <div class="font-mono text-xs text-slate-400">${reqId}</div>
          </td>
          <td class="p-3 font-medium text-slate-700">${req.email || '/'}</td>
          <td class="p-3 text-slate-500 text-xs">${req.date || 'Ni podatka'}</td>
          <td class="p-3 text-slate-500 text-xs">${req.promotionDate || 'Ni sprememb'}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded-full text-xs font-semibold ${statusClass}">
              ${statusText}
            </span>
          </td>
          <td class="p-3">
            <div class="flex space-x-2">
              <button onclick="updateEmailStatus('${reqId}', '${nextStatus}')" class="${actionBtnClass} text-white px-3 py-1 rounded transition text-xs font-medium">
                ${actionBtnText}
              </button>
              <button onclick="deleteRequest('${reqId}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded transition text-xs font-medium">
                Zbriši
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- AKCIJE ---

    // Posodobitev statusa (ob tem se zapiše tudi datum spremembe/napredovanja)
    window.updateEmailStatus = function(reqId, newStatus) {
      const now = new Date().toLocaleString('sl-SI');
      
      db.ref(`waitingList/${reqId}`).update({
        status: newStatus,
        promotionDate: now
      }).catch(err => alert('Napaka pri posodabljanju statusa: ' + err.message));
    };

    // Brisanje prijave (z opozorilom)
    window.deleteRequest = function(reqId) {
      if (confirm("Opozorilo: Ali res želiš trajno izbrisati to prijavo iz baze?")) {
        db.ref(`waitingList/${reqId}`).remove()
          .catch(err => alert('Napaka pri brisanju: ' + err.message));
      }
    };

  </script>
</body>
</html>
