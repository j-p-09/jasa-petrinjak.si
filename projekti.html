<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upravljanje Projektov</title>
    
    <!-- FontAwesome za klasične majhne ikone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Version 8 compat za enostavno CDN vključitev) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* =========================================================
           OSNOVNI WINDOWS 2000 / XP POSLOVNI STIL
           ========================================================= */
        body {
            background-color: #d4d0c8;
            font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            color: #000;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 800px;
        }

        /* Skrivanje in prikazovanje pogledov */
        .view { display: none; }
        .view.active { display: block; }

        /* --- Okna (Windows) --- */
        .win-window {
            background-color: #d4d0c8;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf;
            padding: 2px;
            margin-bottom: 15px;
        }

        /* --- Naslovna vrstica (Title Bar) --- */
        .win-titlebar {
            background: linear-gradient(to right, #0A246A, #A6CAF0);
            color: #fff;
            font-weight: bold;
            padding: 3px 4px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .win-titlebar-text {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .win-titlebar img {
            height: 14px;
        }
        
        .win-content {
            padding: 10px;
        }

        /* --- Gumbi --- */
        .win-btn {
            background-color: #d4d0c8;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #404040;
            border-bottom: 1px solid #404040;
            box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf;
            padding: 3px 8px;
            font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            color: #000;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }
        .win-btn:active {
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            box-shadow: inset 1px 1px #808080;
            padding: 4px 7px 2px 9px; /* Shift content down and right */
        }
        .win-btn i { font-size: 10px; }

        .btn-icon-only { padding: 3px 5px; }

        /* --- Vnosna polja --- */
        .win-input, .win-textarea {
            background-color: #fff;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            box-shadow: inset 1px 1px #808080, inset -1px -1px #dfdfdf;
            padding: 3px;
            font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            width: 100%;
            box-sizing: border-box;
        }
        .win-textarea { resize: none; height: 60px; }

        /* --- Obrazci in Tabele --- */
        .form-group {
            margin-bottom: 8px;
        }
        .form-group label {
            display: block;
            margin-bottom: 3px;
        }
        
        .win-table {
            width: 100%;
            background-color: #fff;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            border-collapse: collapse;
            box-shadow: -1px -1px 0 #404040, 1px 1px 0 #dfdfdf;
        }
        .win-table th, .win-table td {
            border: 1px solid #dfdfdf;
            border-right-color: #c0c0c0;
            border-bottom-color: #c0c0c0;
            padding: 3px 5px;
            text-align: left;
            white-space: nowrap;
        }
        .win-table th {
            background-color: #d4d0c8;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            font-weight: normal;
        }
        .win-table tr:hover td {
            background-color: #0A246A;
            color: white;
        }

        /* --- Projekt trakovi --- */
        .project-strip {
            background-color: #fff;
            border: 1px solid #808080;
            padding: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-title { font-weight: bold; }
        .project-actions { display: flex; gap: 2px; }

        /* --- Dialogi (Modals) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: transparent;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        
        .win-dialog {
            width: 350px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        .dialog-actions {
            margin-top: 15px;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        /* --- Status bar --- */
        .win-statusbar {
            margin-top: 10px;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            padding: 2px 5px;
            color: #404040;
            min-height: 14px;
        }

        /* Prazno stanje */
        .empty-state {
            padding: 15px;
            text-align: center;
            color: #808080;
            font-style: italic;
        }

        /* Read-only info section */
        .info-panel {
            background-color: #d4d0c8;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            padding: 8px;
            margin-bottom: 10px;
        }
        .info-row { margin-bottom: 4px; }
        .info-label { font-weight: bold; display: inline-block; width: 80px; }

        /* Skrijemo vse dokler nismo prijavljeni */
        #dashboard-view, #project-view { display: none; }
        
        /* Mobile prilagoditve (Ohranjamo retro stil!) */
        @media (max-width: 500px) {
            .win-dialog { width: 90%; }
            .win-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

<div id="app-container">

    <!-- ==============================================
         1. PRIJAVA (LOGIN)
         ============================================== -->
    <div id="login-view" class="view active">
        <div class="win-window" style="max-width: 300px; margin: 100px auto;">
            <div class="win-titlebar">
                <div class="win-titlebar-text">
                    <img src="logo.png" alt="Logo" onerror="this.style.display='none'"> Prijava
                </div>
                <div class="win-titlebar-controls">
                    <button class="win-btn btn-icon-only" style="padding:0 3px;" disabled><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="win-content">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Uporabniško ime:</label>
                        <input type="text" id="login-user" class="win-input" value="jasa_petrinjak">
                    </div>
                    <div class="form-group">
                        <label>Geslo:</label>
                        <input type="password" id="login-pass" class="win-input" value="Gorenje1">
                    </div>
                    <div style="color: red; margin-bottom: 5px; min-height: 12px;" id="login-error"></div>
                    <div style="text-align: right;">
                        <button type="submit" class="win-btn">Prijava</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==============================================
         2. DOMAČA STRAN (SEZNAM PROJEKTOV)
         ============================================== -->
    <div id="dashboard-view" class="view">
        <div class="win-window">
            <div class="win-titlebar">
                <div class="win-titlebar-text">
                    <img src="logo.png" alt="Logo" onerror="this.style.display='none'"> Sistem za upravljanje projektov
                </div>
                <div>
                    <i class="fa-brands fa-apple" style="margin-right:3px;" title="Apple"></i>
                    <i class="fa-brands fa-android" style="margin-right:3px;" title="Android"></i>
                    <i class="fa-solid fa-globe" style="margin-right:10px;" title="Splet"></i>
                    <button class="win-btn btn-icon-only" onclick="handleLogout()" title="Odjava"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
            <div class="win-content">
                <div style="margin-bottom: 10px;">
                    <button class="win-btn" onclick="openProjectModal()"><i class="fa-solid fa-plus"></i> Nov projekt</button>
                </div>
                
                <div style="background: #808080; padding: 2px; border-top: 1px solid #404040; border-left: 1px solid #404040;">
                    <div id="projects-list-container" style="background: #fff; min-height: 150px; padding: 2px;">
                        <!-- Projekti se naložijo sem -->
                    </div>
                </div>

                <div class="win-statusbar" id="main-status">Pripravljen.</div>
            </div>
        </div>
    </div>

    <!-- ==============================================
         3. POGLED PROJEKTA IN NAPREDEK
         ============================================== -->
    <div id="project-view" class="view">
        <div class="win-window">
            <div class="win-titlebar">
                <div class="win-titlebar-text">
                    <img src="logo.png" alt="Logo" onerror="this.style.display='none'"> Podrobnosti projekta
                </div>
                <button class="win-btn btn-icon-only" onclick="showDashboard()" title="Zapri in se vrni"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="win-content">
                <div class="info-panel">
                    <div class="info-row"><span class="info-label">Naslov:</span> <span id="view-proj-title"></span></div>
                    <div class="info-row"><span class="info-label">Naročnik:</span> <span id="view-proj-client"></span></div>
                    <div class="info-row"><span class="info-label">Vrsta:</span> <span id="view-proj-type"></span></div>
                    <div class="info-row"><span class="info-label">Opombe:</span> <span id="view-proj-notes"></span></div>
                </div>

                <h3 style="font-size: 11px; margin: 10px 0 5px 0;">Napredek projekta</h3>
                <div style="margin-bottom: 5px;">
                    <button class="win-btn" onclick="openProgressModal()"><i class="fa-solid fa-plus"></i> Dodaj napredek</button>
                </div>
                
                <table class="win-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">Datum</th>
                            <th>Napredek</th>
                            <th style="width: 50px;">Akcije</th>
                        </tr>
                    </thead>
                    <tbody id="progress-list-container">
                        <!-- Napredek se naloži sem -->
                    </tbody>
                </table>

                <div class="win-statusbar" id="project-status">Pripravljen.</div>
            </div>
        </div>
    </div>

</div>

<!-- ==============================================
     MODALNA OKNA (DIALOGI)
     ============================================== -->

<!-- Dialog: Projekt (Dodaj/Uredi) -->
<div id="project-modal" class="modal-overlay">
    <div class="win-window win-dialog">
        <div class="win-titlebar">
            <span id="project-modal-title">Nov projekt</span>
            <button class="win-btn btn-icon-only" onclick="closeModal('project-modal')" style="padding:0 3px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="win-content">
            <input type="hidden" id="proj-id">
            <div class="form-group">
                <label>Naslov projekta:</label>
                <input type="text" id="proj-title" class="win-input">
            </div>
            <div class="form-group">
                <label>Naročnik:</label>
                <input type="text" id="proj-client" class="win-input">
            </div>
            <div class="form-group">
                <label>Vrsta:</label>
                <input type="text" id="proj-type" class="win-input">
            </div>
            <div class="form-group">
                <label>Opombe:</label>
                <textarea id="proj-notes" class="win-textarea"></textarea>
            </div>
            <div class="dialog-actions">
                <button class="win-btn" onclick="closeModal('project-modal')">Prekliči</button>
                <button class="win-btn" onclick="saveProject()"><i class="fa-solid fa-floppy-disk"></i> Shrani</button>
            </div>
        </div>
    </div>
</div>

<!-- Dialog: Napredek (Dodaj/Uredi) -->
<div id="progress-modal" class="modal-overlay">
    <div class="win-window win-dialog">
        <div class="win-titlebar">
            <span id="progress-modal-title">Dodaj napredek</span>
            <button class="win-btn btn-icon-only" onclick="closeModal('progress-modal')" style="padding:0 3px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="win-content">
            <input type="hidden" id="prog-id">
            <div class="form-group">
                <label>Datum:</label>
                <input type="text" id="prog-date" class="win-input">
            </div>
            <div class="form-group">
                <label>Kaj je bilo urejeno:</label>
                <textarea id="prog-desc" class="win-textarea"></textarea>
            </div>
            <div class="dialog-actions">
                <button class="win-btn" onclick="closeModal('progress-modal')">Prekliči</button>
                <button class="win-btn" onclick="saveProgress()"><i class="fa-solid fa-floppy-disk"></i> Shrani</button>
            </div>
        </div>
    </div>
</div>

<!-- Dialog: Potrditev brisanja -->
<div id="confirm-modal" class="modal-overlay">
    <div class="win-window win-dialog" style="width: 250px;">
        <div class="win-titlebar">Potrditev</div>
        <div class="win-content">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                <i class="fa-solid fa-circle-exclamation" style="color: #0A246A; font-size: 24px;"></i>
                <span id="confirm-text">Ali ste prepričani?</span>
            </div>
            <div class="dialog-actions">
                <button class="win-btn" id="confirm-yes">Da</button>
                <button class="win-btn" onclick="closeModal('confirm-modal')">Ne</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* =========================================================
       FIREBASE INICIALIZACIJA
       ========================================================= */
    const firebaseConfig = {
        databaseURL: "https://jasa-petrinak-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    /* =========================================================
       GLOBALNE SPREMENLJIVKE
       ========================================================= */
    let currentProjectId = null;
    let confirmAction = null; // Shrani funkcijo za potrditev brisanja

    /* =========================================================
       PRIJAVA IN ODJAVA
       ========================================================= */
    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('login-user').value;
        const pass = document.getElementById('login-pass').value;
        const errorDiv = document.getElementById('login-error');

        if (user === 'jasa_petrinjak' && pass === 'Gorenje1') {
            errorDiv.innerText = '';
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
            showDashboard();
            setStatus('main-status', 'Uspešna prijava.');
        } else {
            errorDiv.innerText = 'Napačno uporabniško ime ali geslo.';
        }
    }

    function handleLogout() {
        hideAllViews();
        document.getElementById('login-view').classList.add('active');
        currentProjectId = null;
    }

    function showDashboard() {
        hideAllViews();
        document.getElementById('dashboard-view').classList.add('active');
        currentProjectId = null;
    }

    function hideAllViews() {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    }

    /* =========================================================
       POMOŽNE FUNKCIJE UI
       ========================================================= */
    function setStatus(elementId, message) {
        document.getElementById(elementId).innerText = message;
        setTimeout(() => {
            if(document.getElementById(elementId).innerText === message) {
                document.getElementById(elementId).innerText = 'Pripravljen.';
            }
        }, 3000);
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function promptConfirm(text, actionFunction) {
        document.getElementById('confirm-text').innerText = text;
        confirmAction = actionFunction;
        
        const btnYes = document.getElementById('confirm-yes');
        // Odstranimo stare listenerje
        const newBtnYes = btnYes.cloneNode(true);
        btnYes.parentNode.replaceChild(newBtnYes, btnYes);
        
        newBtnYes.addEventListener('click', () => {
            if (confirmAction) confirmAction();
            closeModal('confirm-modal');
        });

        openModal('confirm-modal');
    }

    function getCurrentDateStr() {
        const d = new Date();
        return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;
    }

    /* =========================================================
       LOGIKA PROJEKTOV
       ========================================================= */
    
    // Real-time poslušalec za projekte
    db.ref('projects').on('value', (snapshot) => {
        const container = document.getElementById('projects-list-container');
        container.innerHTML = '';
        
        const data = snapshot.val();
        
        if (!data) {
            container.innerHTML = '<div class="empty-state">Trenutno ni dodanih projektov.</div>';
            return;
        }

        Object.keys(data).forEach(key => {
            const proj = data[key];
            const div = document.createElement('div');
            div.className = 'project-strip';
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'project-title';
            titleSpan.innerText = proj.title || '(Brez imena)';
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'project-actions';
            
            actionsDiv.innerHTML = `
                <button class="win-btn btn-icon-only" onclick="openProjectView('${key}')" title="Odpri projekt"><i class="fa-solid fa-file-lines"></i></button>
                <button class="win-btn btn-icon-only" onclick="openEditProjectModal('${key}')" title="Uredi projekt"><i class="fa-solid fa-pencil"></i></button>
                <button class="win-btn btn-icon-only" onclick="deleteProject('${key}')" title="Izbriši projekt"><i class="fa-solid fa-xmark"></i></button>
            `;
            
            div.appendChild(titleSpan);
            div.appendChild(actionsDiv);
            container.appendChild(div);
        });

        // Če smo v pogledu projekta, osvežimo tudi njegove podatke, če so se spremenili
        if (currentProjectId && data[currentProjectId]) {
            populateProjectView(data[currentProjectId]);
            renderProgress(data[currentProjectId].progress || null);
        }
    });

    function openProjectModal() {
        document.getElementById('project-modal-title').innerText = 'Nov projekt';
        document.getElementById('proj-id').value = '';
        document.getElementById('proj-title').value = '';
        document.getElementById('proj-client').value = '';
        document.getElementById('proj-type').value = '';
        document.getElementById('proj-notes').value = '';
        openModal('project-modal');
    }

    function openEditProjectModal(id) {
        db.ref('projects/' + id).once('value').then(snapshot => {
            const proj = snapshot.val();
            if(!proj) return;
            document.getElementById('project-modal-title').innerText = 'Uredi projekt';
            document.getElementById('proj-id').value = id;
            document.getElementById('proj-title').value = proj.title || '';
            document.getElementById('proj-client').value = proj.client || '';
            document.getElementById('proj-type').value = proj.type || '';
            document.getElementById('proj-notes').value = proj.notes || '';
            openModal('project-modal');
        });
    }

    function saveProject() {
        const id = document.getElementById('proj-id').value;
        const data = {
            title: document.getElementById('proj-title').value,
            client: document.getElementById('proj-client').value,
            type: document.getElementById('proj-type').value,
            notes: document.getElementById('proj-notes').value
        };

        if (id) {
            db.ref('projects/' + id).update(data).then(() => {
                setStatus('main-status', 'Projekt je bil uspešno posodobljen.');
            });
        } else {
            data.createdAt = firebase.database.ServerValue.TIMESTAMP;
            db.ref('projects').push(data).then(() => {
                setStatus('main-status', 'Projekt je bil uspešno shranjen.');
            });
        }
        closeModal('project-modal');
    }

    function deleteProject(id) {
        promptConfirm("Ali ste prepričani, da želite izbrisati ta projekt?", () => {
            db.ref('projects/' + id).remove().then(() => {
                setStatus('main-status', 'Projekt je bil izbrisan.');
                if(currentProjectId === id) showDashboard();
            });
        });
    }

    /* =========================================================
       LOGIKA POSAMEZNEGA PROJEKTA (POGLED IN NAPREDEK)
       ========================================================= */
    function openProjectView(id) {
        currentProjectId = id;
        db.ref('projects/' + id).once('value').then(snapshot => {
            const proj = snapshot.val();
            if(!proj) return;
            
            populateProjectView(proj);
            renderProgress(proj.progress || null);
            
            hideAllViews();
            document.getElementById('project-view').classList.add('active');
            setStatus('project-status', 'Projekt odprt.');
        });
    }

    function populateProjectView(proj) {
        document.getElementById('view-proj-title').innerText = proj.title || '-';
        document.getElementById('view-proj-client').innerText = proj.client || '-';
        document.getElementById('view-proj-type').innerText = proj.type || '-';
        document.getElementById('view-proj-notes').innerText = proj.notes || '-';
    }

    function renderProgress(progressData) {
        const tbody = document.getElementById('progress-list-container');
        tbody.innerHTML = '';

        if (!progressData) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Za ta projekt še ni zabeleženega napredka.</td></tr>';
            return;
        }

        Object.keys(progressData).forEach(key => {
            const prog = progressData[key];
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${prog.date || ''}</td>
                <td style="white-space: normal;">${prog.description || ''}</td>
                <td>
                    <button class="win-btn btn-icon-only" onclick="openEditProgressModal('${key}')" title="Uredi napredek"><i class="fa-solid fa-pencil"></i></button>
                    <button class="win-btn btn-icon-only" onclick="deleteProgress('${key}')" title="Izbriši napredek"><i class="fa-solid fa-xmark"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openProgressModal() {
        document.getElementById('progress-modal-title').innerText = 'Dodaj napredek';
        document.getElementById('prog-id').value = '';
        document.getElementById('prog-date').value = getCurrentDateStr();
        document.getElementById('prog-desc').value = '';
        openModal('progress-modal');
    }

    function openEditProgressModal(progId) {
        db.ref(`projects/${currentProjectId}/progress/${progId}`).once('value').then(snapshot => {
            const prog = snapshot.val();
            if(!prog) return;
            document.getElementById('progress-modal-title').innerText = 'Uredi napredek';
            document.getElementById('prog-id').value = progId;
            document.getElementById('prog-date').value = prog.date || '';
            document.getElementById('prog-desc').value = prog.description || '';
            openModal('progress-modal');
        });
    }

    function saveProgress() {
        const id = document.getElementById('prog-id').value;
        const data = {
            date: document.getElementById('prog-date').value,
            description: document.getElementById('prog-desc').value
        };

        if (id) {
            db.ref(`projects/${currentProjectId}/progress/${id}`).update(data).then(() => {
                setStatus('project-status', 'Napredek je bil uspešno posodobljen.');
            });
        } else {
            db.ref(`projects/${currentProjectId}/progress`).push(data).then(() => {
                setStatus('project-status', 'Napredek je bil uspešno dodan.');
            });
        }
        closeModal('progress-modal');
    }

    function deleteProgress(progId) {
        promptConfirm("Ali ste prepričani, da želite izbrisati ta zapis napredka?", () => {
            db.ref(`projects/${currentProjectId}/progress/${progId}`).remove().then(() => {
                setStatus('project-status', 'Napredek je bil izbrisan.');
            });
        });
    }

</script>
</body>
</html>
